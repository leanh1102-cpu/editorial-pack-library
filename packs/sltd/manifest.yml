package_id: sltd
package_name: "SLTD Editorial Pack"
version: "1.2.0"
pack_type: project_pack
inherits:
  - ../../core/vietnamese_prose
  - ../../core/job_packet
compatible_core: ">=1.1.0 <2.0.0"
allowed_tasks:
  - audit_scene
  - rewrite_scene
  - line_edit
  - flow_pass
  - seam_pass
  - story_arc_audit
forbidden_tasks:
  - manage_notion_tasks
  - workflow_management
  - github_issue_management
  - project_board_management
  - canon_invention
  - project_structure_changes
required_files:
  - PACK.md
  - ../../core/job_packet/EDITORIAL_JOB_PACKET.md
  - ../../core/job_packet/ACCEPTANCE_CRITERIA.md
  - ../../core/job_packet/RED_FLAGS.md
  - rules/sltd_style_rules.md
  - rules/sltd_canon_guard.md
  - rules/sltd_story_momentum.md
  - prompts/audit_scene.md
  - prompts/rewrite_scene.md
  - prompts/audit_story_arc.md
priority:
  - user_current_instruction
  - notion_locked_decision
  - provided_scene_packet
  - sltd_project_pack
  - core_job_packet
  - core_vietnamese_prose
fail_closed: true
deprecated: []
