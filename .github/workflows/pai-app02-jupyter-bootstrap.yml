name: PAI APP-02 JupyterLab Public Bootstrap

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/pai-app02-jupyter-bootstrap.yml

permissions:
  contents: read

jobs:
  acquire-jupyterlab:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Resolve exact JupyterLab closure and download binary wheels
        shell: bash
        env:
          PAI_SOURCE_COMMIT: 71271c3743d078eea21d79cb09f598ec2b6b5e78
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/pai-app02"
          TREE="$ROOT/pai-app02-jupyter-wheelhouse"
          mkdir -p "$TREE/wheelhouse"
          python -m venv "$ROOT/resolver"
          "$ROOT/resolver/bin/python" -m pip install \
            'jupyterlab==4.5.3' \
            'jupyter_server==2.17.0' \
            'ipykernel==7.2.0' \
            'nbclient==0.10.4' \
            'nbformat==5.10.4'
          "$ROOT/resolver/bin/python" - <<'PY'
          import importlib.metadata as md, json, os, pathlib
          from packaging.utils import canonicalize_name
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'pai-app02'
          rows=[]
          for d in md.distributions(path=[str(root/'resolver/lib/python3.13/site-packages')]):
              name=d.metadata.get('Name')
              if not name or canonicalize_name(name)=='pip':
                  continue
              rows.append({'name':name,'canonical':canonicalize_name(name),'version':d.version})
          rows=sorted({r['canonical']:(r) for r in rows}.values(), key=lambda x:x['canonical'])
          (root/'resolved.json').write_text(json.dumps(rows,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          (root/'requirements.resolved').write_text(''.join(f"{r['name']}=={r['version']}\n" for r in rows),encoding='utf-8')
          print('resolved_count',len(rows))
          PY
          "$ROOT/resolver/bin/python" -m pip download --only-binary=:all: --dest "$TREE/wheelhouse" -r "$ROOT/requirements.resolved"

      - name: Build hash-locked manifest
        shell: bash
        env:
          PAI_SOURCE_COMMIT: 71271c3743d078eea21d79cb09f598ec2b6b5e78
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/pai-app02"
          TREE="$ROOT/pai-app02-jupyter-wheelhouse"
          "$ROOT/resolver/bin/python" - <<'PY'
          import hashlib, json, os, pathlib
          from packaging.utils import parse_wheel_filename, canonicalize_name
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'pai-app02'
          tree=root/'pai-app02-jupyter-wheelhouse'; wh=tree/'wheelhouse'
          resolved=json.loads((root/'resolved.json').read_text())
          expected={r['canonical']:r for r in resolved}
          roots=['jupyterlab==4.5.3','jupyter_server==2.17.0','ipykernel==7.2.0','nbclient==0.10.4','nbformat==5.10.4']
          root_spelling={canonicalize_name(x.split('==')[0]):x.split('==')[0] for x in roots}
          wheels={}
          def hfile(p):
              h=hashlib.sha256()
              with p.open('rb') as f:
                  for b in iter(lambda:f.read(1024*1024),b''): h.update(b)
              return h.hexdigest()
          for p in sorted(wh.glob('*.whl')):
              name,version,build,tags=parse_wheel_filename(p.name)
              key=canonicalize_name(str(name))
              if key in wheels: raise SystemExit(f'duplicate wheel distro {key}')
              wheels[key]={'path':p,'version':str(version),'sha256':hfile(p)}
          if set(wheels)!=set(expected):
              raise SystemExit(f'wheel closure mismatch missing={sorted(set(expected)-set(wheels))} extra={sorted(set(wheels)-set(expected))}')
          lines=[]
          for key in sorted(wheels):
              r=expected[key]; w=wheels[key]
              if w['version']!=r['version']: raise SystemExit(f'version mismatch {key}')
              name=root_spelling.get(key,r['name'])
              lines.append(f"{name}=={r['version']} --hash=sha256:{w['sha256']}")
          lock='\n'.join(lines)+'\n'
          lock_path=tree/'requirements.lock'; lock_path.write_text(lock,encoding='utf-8')
          lock_digest=hashlib.sha256(lock.encode()).hexdigest()
          files=[]
          for p in [lock_path,*sorted(wh.glob('*.whl'))]:
              files.append({'path':str(p.relative_to(tree)),'sha256':hfile(p),'size':p.stat().st_size})
          manifest={
            'schema_version':'1.0','project_id':'PAI-LINUX-001','target_release':'PAI-LINUX-1.3-APPLICATION-PLATFORM','action':'APP-02',
            'artifact_type':'PAI_APP02_JUPYTERLAB_OFFLINE_WHEELHOUSE','source_commit':os.environ['PAI_SOURCE_COMMIT'],
            'python_series':'3.13','root_requirements':roots,'wheel_count':len(wheels),'lock_digest':lock_digest,'files':files,
            'acquisition_network_required':True,'acquisition_root_required':False,'offline_install_root_required':False,
            'canonical_runtime_network_required':False,'canonical_runtime_dns_required':False,'public_ingress':False,
            'new_completion_action':False,'new_completion_gate':False,'runtime_pass_claimed_for_app02':False
          }
          (tree/'manifest.json').write_text(json.dumps(manifest,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          print(json.dumps({'wheel_count':len(wheels),'lock_digest':lock_digest},sort_keys=True))
          PY

      - name: Prove offline installation from wheelhouse
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/pai-app02"
          TREE="$ROOT/pai-app02-jupyter-wheelhouse"
          python -m venv "$ROOT/offline-test"
          "$ROOT/offline-test/bin/pip" install --no-index --find-links "$TREE/wheelhouse" --require-hashes -r "$TREE/requirements.lock"
          "$ROOT/offline-test/bin/python" - <<'PY'
          import json,jupyterlab,jupyter_server,ipykernel,nbclient,nbformat
          got={'jupyterlab':jupyterlab.__version__,'jupyter_server':jupyter_server.__version__,'ipykernel':ipykernel.__version__,'nbclient':nbclient.__version__,'nbformat':nbformat.__version__}
          exp={'jupyterlab':'4.5.3','jupyter_server':'2.17.0','ipykernel':'7.2.0','nbclient':'0.10.4','nbformat':'5.10.4'}
          assert got==exp,(got,exp)
          print(json.dumps(got,sort_keys=True))
          PY
          "$ROOT/offline-test/bin/jupyter-lab" --version
          "$ROOT/offline-test/bin/jupyter" --version

      - name: Pack APP-02 artifact and receipt
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/pai-app02"
          cd "$ROOT"
          tar -czf pai-app02-jupyterlab-offline-wheelhouse.tar.gz pai-app02-jupyter-wheelhouse
          python - <<'PY'
          import hashlib,json,pathlib
          root=pathlib.Path('.')
          art=root/'pai-app02-jupyterlab-offline-wheelhouse.tar.gz'
          man=json.loads((root/'pai-app02-jupyter-wheelhouse/manifest.json').read_text())
          h=hashlib.sha256(art.read_bytes()).hexdigest()
          receipt={'decision':'PAI_APP02_JUPYTERLAB_PUBLIC_BOOTSTRAP_ACQUIRE_PASS','artifact_sha256':h,'artifact_size':art.stat().st_size,'wheel_count':man['wheel_count'],'lock_digest':man['lock_digest'],'offline_install_simulation':'PASS','runtime_pass_claimed_for_app02':False,'new_completion_action':False,'new_completion_gate':False}
          (root/'bootstrap-receipt.json').write_text(json.dumps(receipt,indent=2,sort_keys=True)+'\n')
          print(json.dumps(receipt,sort_keys=True))
          PY

      - name: Upload verified wheelhouse
        uses: actions/upload-artifact@v4
        with:
          name: pai-app02-jupyterlab-offline-wheelhouse-py313-x64
          path: |
            ${{ runner.temp }}/pai-app02/pai-app02-jupyterlab-offline-wheelhouse.tar.gz
            ${{ runner.temp }}/pai-app02/bootstrap-receipt.json
          if-no-files-found: error
          retention-days: 3
