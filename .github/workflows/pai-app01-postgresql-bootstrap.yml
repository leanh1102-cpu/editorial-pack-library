name: PAI APP-01 PostgreSQL Public Bootstrap

on:
  push:
    branches:
      - pai-app01-postgresql-bootstrap-20260807

permissions:
  contents: read

jobs:
  acquire-postgresql:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PG_VERSION: "17.10.0"
      PG_TARGET: "x86_64-unknown-linux-gnu"
      UPSTREAM_REPO: "theseus-rs/postgresql-binaries"
      UPSTREAM_COMMIT: "857b124c15efc26d98161e931ad906c9c5944491"
      PAI_SOURCE_COMMIT: "211cfb5cfc315427d1d36b48096cd9f6e327e767"
    steps:
      - name: Checkout bootstrap branch
        uses: actions/checkout@v4

      - name: Acquire and verify upstream PostgreSQL archive
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="postgresql-${PG_VERSION}-${PG_TARGET}.tar.gz"
          CHECKSUM="${ARCHIVE}.sha256"
          BASE="https://github.com/${UPSTREAM_REPO}/releases/download/${PG_VERSION}"
          mkdir -p "$RUNNER_TEMP/pai-app01"
          cd "$RUNNER_TEMP/pai-app01"
          curl --fail --location --retry 4 --retry-all-errors --connect-timeout 20 --max-time 300 \
            --output "$CHECKSUM" "$BASE/$CHECKSUM"
          curl --fail --location --retry 4 --retry-all-errors --connect-timeout 20 --max-time 600 \
            --output "$ARCHIVE" "$BASE/$ARCHIVE"
          python3 - <<'PY'
          import hashlib, os, pathlib, re
          version=os.environ['PG_VERSION']; target=os.environ['PG_TARGET']
          archive=f"postgresql-{version}-{target}.tar.gz"
          checksum=pathlib.Path(archive+'.sha256').read_text(encoding='utf-8').strip().splitlines()
          if len(checksum) != 1:
              raise SystemExit('checksum file must have one non-empty line')
          parts=checksum[0].split()
          if len(parts) != 2 or parts[1].lstrip('*') != archive or not re.fullmatch(r'[0-9a-f]{64}', parts[0]):
              raise SystemExit('checksum identity mismatch')
          h=hashlib.sha256()
          with open(archive,'rb') as f:
              for block in iter(lambda:f.read(1024*1024), b''):
                  h.update(block)
          actual=h.hexdigest()
          if actual != parts[0]:
              raise SystemExit(f'archive sha256 mismatch: {actual} != {parts[0]}')
          print('PAI_APP01_UPSTREAM_SHA256_PASS', actual)
          PY

      - name: Inspect PostgreSQL runtime tree
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="postgresql-${PG_VERSION}-${PG_TARGET}.tar.gz"
          ROOT="$RUNNER_TEMP/pai-app01/postgresql-${PG_VERSION}-${PG_TARGET}"
          mkdir -p "$RUNNER_TEMP/pai-app01/extract"
          tar -xzf "$RUNNER_TEMP/pai-app01/$ARCHIVE" -C "$RUNNER_TEMP/pai-app01/extract"
          ROOT="$RUNNER_TEMP/pai-app01/extract/postgresql-${PG_VERSION}-${PG_TARGET}"
          for cmd in postgres initdb pg_ctl psql; do
            test -x "$ROOT/bin/$cmd"
            "$ROOT/bin/$cmd" --version
          done
          file "$ROOT/bin/postgres" | grep -E 'x86-64|x86_64'
          echo "PAI_APP01_POSTGRESQL_COMMAND_INVENTORY_PASS"

      - name: Create APP-01 compatible portable lock
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/pai-app01"
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess, tarfile
          version=os.environ['PG_VERSION']; target=os.environ['PG_TARGET']
          upstream=os.environ['UPSTREAM_REPO']; upstream_commit=os.environ['UPSTREAM_COMMIT']
          pai_source=os.environ['PAI_SOURCE_COMMIT']
          base_name=f'postgresql-{version}-{target}'
          archive_name=base_name+'.tar.gz'
          archive=pathlib.Path(archive_name)
          checksum_name=archive_name+'.sha256'
          release_base=f'https://github.com/{upstream}/releases/download/{version}'
          def hash_file(p):
              h=hashlib.sha256()
              with open(p,'rb') as f:
                  for b in iter(lambda:f.read(1024*1024), b''):
                      h.update(b)
              return h.hexdigest()
          with tarfile.open(archive,'r:gz') as tf:
              members=tf.getmembers()
          home=pathlib.Path('extract')/base_name
          env={**os.environ, 'PATH':f"{home/'bin'}:{os.environ.get('PATH','')}", 'LD_LIBRARY_PATH':f"{home/'lib'}:{os.environ.get('LD_LIBRARY_PATH','')}"}
          versions={}
          for name in ('postgres','initdb','pg_ctl','psql'):
              cp=subprocess.run([str(home/'bin'/name),'--version'],env=env,text=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT,check=True)
              versions[name]=cp.stdout.strip()
          lock={
            'project_id':'PAI-LINUX-001',
            'target_release':'PAI-LINUX-1.3-APPLICATION-PLATFORM',
            'action':'APP-01',
            'decision':'PAI_APP01_POSTGRESQL_PORTABLE_CLOSURE_PINNED',
            'artifact_type':'PAI_APP01_POSTGRESQL_PORTABLE_BINARY_CLOSURE',
            'pai_source_commit':pai_source,
            'upstream_repository':upstream,
            'upstream_tag':version,
            'upstream_commit':upstream_commit,
            'upstream_target':target,
            'archive_name':archive_name,
            'archive_url':f'{release_base}/{archive_name}',
            'checksum_url':f'{release_base}/{checksum_name}',
            'required_commands':['postgres','initdb','pg_ctl','psql'],
            'acquisition_network_required':True,
            'acquisition_root_required':False,
            'offline_install_root_required':False,
            'canonical_runtime_network_required':False,
            'canonical_runtime_dns_required':False,
            'public_ingress':False,
            'new_completion_action':False,
            'new_completion_gate':False,
            'runtime_pass_claimed_for_app01':False,
            'schema_version':'1.0',
            'archive_sha256':hash_file(archive),
            'archive_size':archive.stat().st_size,
            'archive_member_count':len(members),
            'runtime_versions':versions,
            'upstream_checksum_verified':True,
            'offline_install_mode':'ROOTLESS_PORTABLE_TREE',
            'portable_home_env':'PAI_POSTGRESQL_HOME',
          }
          canonical=(json.dumps(lock,ensure_ascii=False,sort_keys=True,separators=(',',':'))+'\n').encode()
          lock['lock_digest']=hashlib.sha256(canonical).hexdigest()
          pathlib.Path('app01-postgresql-portable-lock.json').write_text(json.dumps(lock,ensure_ascii=False,sort_keys=True,indent=2)+'\n',encoding='utf-8')
          summary={
            'decision':'PAI_APP01_POSTGRESQL_PUBLIC_BOOTSTRAP_ACQUIRE_PASS',
            'archive_sha256':lock['archive_sha256'],
            'archive_size':lock['archive_size'],
            'archive_member_count':lock['archive_member_count'],
            'runtime_versions':versions,
            'lock_digest':lock['lock_digest'],
            'runtime_pass_claimed_for_app01':False,
            'new_completion_action':False,
            'new_completion_gate':False,
          }
          pathlib.Path('bootstrap-receipt.json').write_text(json.dumps(summary,sort_keys=True,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(summary,sort_keys=True))
          PY

      - name: Upload verified portable closure
        uses: actions/upload-artifact@v4
        with:
          name: pai-app01-postgresql-portable-17.10.0-linux-x64
          path: |
            ${{ runner.temp }}/pai-app01/postgresql-17.10.0-x86_64-unknown-linux-gnu.tar.gz
            ${{ runner.temp }}/pai-app01/postgresql-17.10.0-x86_64-unknown-linux-gnu.tar.gz.sha256
            ${{ runner.temp }}/pai-app01/app01-postgresql-portable-lock.json
            ${{ runner.temp }}/pai-app01/bootstrap-receipt.json
          if-no-files-found: error
          retention-days: 3
