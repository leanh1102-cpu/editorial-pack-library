name: PAI OPR-01 exact Debian QCOW2 handoff

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/pai-opr01-exact-qcow2.yml

permissions:
  contents: read

jobs:
  exact-qcow2:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Download verify and content-address exact Debian QCOW2
        shell: bash
        run: |
          set -euo pipefail
          ROOT=/tmp/pai-opr01
          mkdir -p "$ROOT/chunks"
          OUT="$ROOT/debian-13-genericcloud-amd64-20260712-2537.qcow2"
          URL=https://cloud.debian.org/cdimage/cloud/trixie/20260712-2537/debian-13-genericcloud-amd64-20260712-2537.qcow2
          EXPECTED_SHA512=7ae53e9dbee282bfc16f289dec483dde3a8598769c38a267948310f7a2a52c662620198603bc52c142627efba379863d16079698a10b34102d55bcedd40e8d32
          EXPECTED_SIZE=340393984
          curl --fail --show-error --location \
            --retry 5 --retry-delay 2 --retry-all-errors \
            --connect-timeout 20 --max-time 600 \
            --output "$OUT" "$URL"
          printf '%s  %s\n' "$EXPECTED_SHA512" "$OUT" | sha512sum --check --strict
          test "$(stat -c '%s' "$OUT")" = "$EXPECTED_SIZE"
          sha512sum "$OUT" > "$ROOT/SHA512SUM"
          sha256sum "$OUT" > "$ROOT/SHA256SUM"
          split -b 75000000 -d -a 2 "$OUT" "$ROOT/chunks/qcow2.part-"
          python3 - "$ROOT" "$OUT" <<'PY'
          import hashlib, json, pathlib, sys
          root = pathlib.Path(sys.argv[1]); image = pathlib.Path(sys.argv[2])
          def digest(path, algo):
              h = hashlib.new(algo)
              with path.open('rb') as f:
                  for block in iter(lambda: f.read(8*1024*1024), b''):
                      h.update(block)
              return h.hexdigest()
          chunks=[]
          for index, path in enumerate(sorted((root/'chunks').glob('qcow2.part-*'))):
              chunks.append({'index': index, 'name': path.name, 'size': path.stat().st_size, 'sha256': digest(path,'sha256')})
          manifest={
            'schema_version':'1.0',
            'project_id':'PAI-LINUX-001',
            'release':'PAI-LINUX-1.4-OPERATIONAL-SYSTEM',
            'action':'OPR-01',
            'artifact_type':'EXACT_PINNED_DEBIAN_QCOW2_CHUNK_MANIFEST',
            'filename':image.name,
            'size':image.stat().st_size,
            'sha256':digest(image,'sha256'),
            'sha512':digest(image,'sha512'),
            'chunk_size_max':75000000,
            'chunks':chunks,
            'reconstruction':'concatenate chunks in ascending index, then verify whole-file SHA-512',
          }
          (root/'chunk-manifest.json').write_text(json.dumps(manifest,indent=2,sort_keys=True)+'\n')
          PY
          printf 'PAI_OPR01_EXACT_QCOW2_CHUNK_HANDOFF_PASS\n' > "$ROOT/decision.txt"
          cat "$ROOT/chunk-manifest.json"

      - name: Upload chunk 00
        uses: actions/upload-artifact@v4
        with:
          name: pai-opr01-qcow2-part-00
          path: /tmp/pai-opr01/chunks/qcow2.part-00
          retention-days: 1
          compression-level: 0
      - name: Upload chunk 01
        uses: actions/upload-artifact@v4
        with:
          name: pai-opr01-qcow2-part-01
          path: /tmp/pai-opr01/chunks/qcow2.part-01
          retention-days: 1
          compression-level: 0
      - name: Upload chunk 02
        uses: actions/upload-artifact@v4
        with:
          name: pai-opr01-qcow2-part-02
          path: /tmp/pai-opr01/chunks/qcow2.part-02
          retention-days: 1
          compression-level: 0
      - name: Upload chunk 03
        uses: actions/upload-artifact@v4
        with:
          name: pai-opr01-qcow2-part-03
          path: /tmp/pai-opr01/chunks/qcow2.part-03
          retention-days: 1
          compression-level: 0
      - name: Upload chunk 04
        uses: actions/upload-artifact@v4
        with:
          name: pai-opr01-qcow2-part-04
          path: /tmp/pai-opr01/chunks/qcow2.part-04
          retention-days: 1
          compression-level: 0
      - name: Upload reconstruction manifest
        uses: actions/upload-artifact@v4
        with:
          name: pai-opr01-qcow2-reconstruction-manifest
          path: |
            /tmp/pai-opr01/chunk-manifest.json
            /tmp/pai-opr01/SHA512SUM
            /tmp/pai-opr01/SHA256SUM
            /tmp/pai-opr01/decision.txt
          retention-days: 1
          compression-level: 0
